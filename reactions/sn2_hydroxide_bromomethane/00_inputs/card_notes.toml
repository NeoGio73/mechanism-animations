experimental = """Experiment: k(HO⁻ + CH₃Br, water, 25 °C) ≈ 1.4 × 10⁻⁴ M⁻¹ s⁻¹ \
(Ea = 96.3 kJ/mol (23.0 kcal/mol)). Eyring at 298.15 K (1 M standard state) \
gives ΔG‡ ≈ 95.0 kJ/mol (22.7 kcal/mol). \
Sources: W. Mabey and T. Mill, J. Phys. Chem. Ref. Data 1978, 7, 383–415, doi:10.1063/1.555572 \
(critical review, Tables 4.2 and 5.1; free reprint at srd.nist.gov). Values checked against the \
review itself: Table 4.2 gives k = 0.352 M⁻¹ s⁻¹ at 373 K, Ea = 96.3 kJ/mol (23.0 kcal/mol) and \
log A = 13.017; Table 5.1 gives k = 1.41 × 10⁻⁴ M⁻¹ s⁻¹ at 298 K. The 298 K value is the review's \
extrapolation from the higher-temperature data, not a measurement at 298 K. The review's source for the \
methyl halide data (its ref. 7) is I. Fells and E. A. Moelwyn-Hughes, J. Chem. Soc. 1959, 398, \
doi:10.1039/JR9590000398. That paper's title concerns the chlorinated methanes, so the CH₃Br \
coefficients may come from a companion paper, R. H. Bathgate and E. A. Moelwyn-Hughes, \
J. Chem. Soc. 1959, 2642, doi:10.1039/JR9590002642."""

