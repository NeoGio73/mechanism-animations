# Full recomputation at the M06-2X working level (J. Picione, 2026-11-11), from hshift_3_methyl_2_butyl.
# Made by pipeline/new_level_folder.py; the source folder stays untouched.
# 00_inputs written 2026-11-13 (--inputs-only) beside the existing M06-2X stationary points;
# TS guess = 01_stationary/ts/ts.xyz. IRC: true IRC (pipeline/true_irc_prod.py).
# Carbocation 1,2-hydride shift, first attempt (J. Picione, 2026-11-10):
# 3-methyl-2-butyl cation (secondary) → 2-methyl-2-butyl cation (tertiary).
# Step 1 only: is the secondary cation a true minimum (all real frequencies, not hydrogen-bridged)?
# If it is not, or the shift has no barrier: stop, report, and switch to the fallback
# (degenerate shift in the 2,3-dimethyl-2-butyl cation, reactions/hshift_2_3_dimethyl_2_butyl).
id = "hshift_3_methyl_2_butyl"
title = "1,2-Hydride shift, 3-methyl-2-butyl cation → 2-methyl-2-butyl cation"
equation = "CH₃CH⁺CH(CH₃)₂ → CH₃CH₂C⁺(CH₃)₂"
charge = 1
mult = 1
# Experiments on these cations are in superacid media, which SMD has no parameters for;
# dichloromethane is a polar, non-nucleophilic stand-in (J. Picione, 2026-11-10). Gas phase is
# run alongside for comparison.
solvent = "dichloromethane"

ts_guess = "ts_guess_m062x.xyz"   # its own 01_stationary/ts
method = "M062X D3ZERO ma-def2-SVP def2/J RIJCOSX VeryTightSCF DefGrid3"
sp_method = "M062X D3ZERO ma-def2-TZVP def2/J RIJCOSX VeryTightSCF DefGrid3"
# Orbital stage (J. Picione, 2026-11-10): also show the empty p orbital as the lowest unoccupied
# orbital, CANONICAL (not an IBO), labelled "lowest unoccupied orbital, canonical" in the viewer
# and on the card, its own toggle and a visually distinct surface, tracked along the path, so it is
# not read as one of the tracked electron pairs. If it spreads onto neighbouring C–H bonds, leave
# it: that is hyperconjugation, and it gets a sentence on the card.

nprocs = 4
maxcore_mb = 3000

[[diagnostic_levels]]
label = "B3LYP_ma-def2-TZVP"
why = "the former working functional, for comparison"
method = "B3LYP D3BJ ma-def2-TZVP def2/J RIJCOSX VeryTightSCF"

# Key atoms added 2026-11-13 for the production true IRC (its stopping rule needs bond events), read
# from the M06-2X TS (01_stationary/ts, the eclip-side C2–C3 rotation TS, 92i cm⁻¹): H9 sits on C3
# (1.113 Å) and points at C2 (2.008 Å); past the rotation it shifts to C2 without a barrier (docs/protocol.md).
# Atom numbers 0-based as in the xyz: C2 = 1, C3 = 3, H = 9.
[key_atoms]
nucleophile = 1
center = 9
leaving_group = 3

[[key_bonds]]
atoms = [1, 9]
role = "forms"
label = "C2–H"

[[key_bonds]]
atoms = [3, 9]
role = "breaks"
label = "C3–H"
