# Note 2 (J. Picione, 2026-11-11; card wording 2026-11-26): context only, never a comparison.
context_note = "No measured value on this card. The 3-methyl-2-butyl cation has not been observed: it rearranges too fast. For context only, not as a comparison: for the 1,2-hydride shift in the 2-butyl cation (a different, degenerate shift between two secondary carbons), Saunders and Kates give an upper limit, ΔG‡ < 10 kJ/mol (2.4 kcal/mol), from the absence of ¹³C NMR line broadening at −140 °C (M. Saunders and M. R. Kates, J. Am. Chem. Soc. 1978, 100, 7082–7083; reviewed in Saunders and Jiménez-Vázquez 1991)."

# Draft (2026-11-26), from docs/results/hshift_3_methyl_2_butyl.md and 01_stationary/rotation_ts.json; not yet approved.
mechanism_note = "In this calculation (implicit dichloromethane) the transition state comes before the hydrogen moves: it is a twist about the C2–C3 bond (C1–C2–C3–H from −161.9° at the start to −122.7° at the transition state) that turns the C3–H bond toward the empty orbital on C2. At the transition state C2–H is still 2.01 Å (2.13 Å at the start); 88 % of its shortening, to 1.12 Å, comes after the transition state, downhill. The lowest form of the secondary cation (anti, 3.1 kJ/mol (0.7 kcal/mol) below the start of the path) reaches the tertiary cation through its own rotation transition state, 6.0 kJ/mol (1.4 kcal/mol) higher than the one shown (working level, electronic)."
mechanism_note_draft = true

# J. Picione, 2026-11-26: his wording, verbatim. Numbers: docs/results/hshift_hyperconjugation.md (Mulliken shares;
# same caveat as for E2).
documented_note = "Tracking also finds two bonding pairs that are shared with C2 at the start of the path and end as ordinary bonds. They are not extra arrows. The C3–CH₃ pair starts as a three-centre bond: the methyl bridges C2 and C3 (C2–CH₃ 1.70 Å, C3–CH₃ 1.80 Å), so the starting ion is not the open secondary cation of the textbook drawing. A C1–H pair leans toward C2 by hyperconjugation. Both return to ordinary bonds during the C2–C3 rotation, before the transition state and before the hydrogen moves (Mulliken shares on C2: 0.36 and 0.17 at the start, 0.03 and 0.04 at the transition state)."

limitations = [
  "Conformers (draft, 2026-11-26, from SI entry 9): two forms of the secondary cation are minima at this level, anti and eclipsed; a third start, with C3–H in line with the empty p orbital, goes downhill to the tertiary cation. Both minima are partly methyl-bridged (C2–CH₃ 1.80 Å and 1.70 Å). Barriers are given from the anti form, the lowest in working-level free energy (rule of J. Picione, 2026-11-19), and from the eclipsed form where the path starts, 3.1 kJ/mol (0.7 kcal/mol) higher in E and 2.8 kJ/mol (0.7 kcal/mol) in G (working level).",
]
