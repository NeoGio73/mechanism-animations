#    to C–H hyperconjugation: stretched C3–CH₃ 1.60–1.61 Å, C2–C3–CH₃ 92–95° in the minima;
#    1.567 Å, 107–110° at the rotation transition states (DCM). When orbitals are built, track
#    σ(C3–CH₃) as well as σ(C3–H) and the unoccupied orbital.
# 4. Which of the two rotation paths ("anti" side or "eclip" side) to animate: wait for
#    J. Picione's reply to the gas-phase and M06-2X report.
