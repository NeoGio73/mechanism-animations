#    optimizations take 40–44 steps, downhill, to the tertiary cation.)
# 2. No measured value on this card. State that the 3-methyl-2-butyl cation has not been observed
#    because it rearranges too fast. Give the 2-butyl upper limit (below 2.4 kcal/mol, 10 kJ/mol)
#    as context only, not as a comparison. Source RESOLVED (J. Picione, 2026-11-11): primary
#    Saunders and Kates 1978, p. 7083, final paragraph (no ¹³C NMR broadening for 2-butyl at
#    −140 °C; ΔG‡ < 2.4 kcal/mol); secondary Saunders and Jiménez-Vázquez 1991. The −190 °C
#    solid-state result is Myhre and Yannoni 1981 (not read). As printed: rate ≥ 4 × 10⁹ s⁻¹,
#    ΔG‡ ≤ 2.4 kcal/mol (10 kJ/mol), −140 °C. Status: rechecked; printed value confirmed;
#    probable misprint noted (J. Picione, 2026-11-11). Our inference, not the paper's: the two
#    disagree by Eyring (4 × 10⁹ s⁻¹ → 7.2 kJ/mol, 1.7 kcal/mol; 4 × 10⁸ s⁻¹ → 9.8 kJ/mol,
#    2.3 kcal/mol); by the paper's line-broadening formula 4 × 10⁸ s⁻¹ means 1.4 Hz, close to the
#    smallest width in its Table I (2 Hz), while 4 × 10⁹ s⁻¹ would need 0.14 Hz (verified against the
#    paper's formula, p. 7082: k = (π/2)(Δ²/W), Δ = 277 ppm, 18,803 Hz); so the exponent is
#    probably a misprint for 10⁸ (details in docs/references.md). The card quotes only the
#    2.4 kcal/mol (10 kJ/mol) limit and does not quote the rate.
