experimental_details = "Experiment (water, 25 °C): cyanide addition to acetone, alkoxide formation. Equilibrium K = [R₂C(O⁻)CN]/([R₂C=O][CN⁻]), log K = −1.84, K = 0.0145 M⁻¹, ΔG° = +10.5 kJ/mol (+2.5 kcal/mol); rate = k[CN⁻][R₂C=O], log k = 0.60, k = 4.0 M⁻¹ s⁻¹, ΔG‡ = 69.6 kJ/mol (16.6 kcal/mol) (Eyring, 298.15 K, 1 M standard state, no transmission correction). All three measured values are in the tables above, next to the computed ones. Source: Schlesinger and Miller 1973 (G. Schlesinger and S. L. Miller, J. Am. Chem. Soc. 1973, 95, 3729–3735, doi:10.1021/ja00792a043), Table IV, acetone row: k₂ = 3.97 M⁻¹ s⁻¹ (CN⁻ + acetone → alkoxide), K₂ = 68.5 M (alkoxide → acetone + CN⁻; 1/K₂ = 0.0146 M⁻¹), k₋₂ = 272 s⁻¹ (alkoxide → acetone + CN⁻), giving ΔG‡ = 69.6 kJ/mol (16.6 kcal/mol), ΔG° = +10.5 kJ/mol (+2.5 kcal/mol) and ΔG‡(reverse) = 59.1 kJ/mol (14.1 kcal/mol). The same values, as log k = 0.60 and log K = −1.84, are compiled in Guthrie 1998 (J. P. Guthrie, J. Am. Chem. Soc. 1998, 120, 1688–1694, doi:10.1021/ja970506q, Table 1)."
card_limitations = [
  # limitation 1: J. Picione's wording, 2026-11-27, after the NNC retry (replaces his earlier text with the CCC n = 3 values)
  "The solvent is a continuum (SMD water): the hydrogen bonds that water gives to the alkoxide oxygen are missing, so the alkoxide is too high in energy. A test with one to three water molecules added around the ions supports this for the reaction free energy, which falls with each added water, from +36.4 to +14.7 kJ/mol (measured +10.5 kJ/mol), and has not levelled off at three. The barrier does not improve: it rises to about 85 kJ/mol with one, two or three waters (measured 69.6 kJ/mol). The test shows the size of the effect, not a corrected value. The numbers on this card are without added waters.",
  "The coupled-cluster ΔG‡ is 9.7 kJ/mol (2.3 kcal/mol) above the measured value. That difference should not be over-read either: besides the continuum solvent, the geometries and thermal corrections come from M06-2X, and the choice of solvation scheme alone moves this barrier by about 1 kJ/mol. M06-2X/ma-def2-TZVP on the same geometries gives 72.1 kJ/mol (17.2 kcal/mol).",
  "The path ends at the alkoxide, (CH₃)₂C(CN)O⁻, which lies above cyanide + acetone in free energy: the addition step on its own is uphill. The neutral cyanohydrin forms only after a later proton transfer (from HCN or water), which is not part of this path.",
  "The measured equilibrium constant rests on an estimated, not measured, acidity of the cyanohydrin O–H, so the measured ΔrG (+10.5 kJ/mol) is uncertain by a few kJ/mol. The measured rate constant does not depend on it.",
  "The measured rate constant refers to free cyanide: only CN⁻, not HCN, adds to the carbonyl, so observed rates depend on pH.",
  "In the continuum solvent, cyanide and acetone form a loose complex 8.1 kJ/mol (1.9 kcal/mol) below the separated molecules (DLPNO-CCSD(T)/ma-def2-TZVP, electronic); this shallow well is partly an artifact of the model.",
]
