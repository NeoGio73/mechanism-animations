# Measured values supplied by J. Picione from Guthrie 1998, Table 1, and from the original paper,
# Schlesinger and Miller 1973, Table IV (both read 2026-11-11). k₋₂ = 272 s⁻¹ → ΔG‡(reverse) = 59.13 kJ/mol
# (checked); k₋₂ is derived, not measured: k₋₂ = k₂K₂ = k₂K′K_HCN/K₃ (eq. 24, p. 3734; confirmed by J. Picione).
# Conversions checked (298.15 K, 1 M standard state, Eyring with no transmission correction):
# K = 10^-1.84 = 0.0145 M⁻¹ → ΔG° = −RT ln K = +10.50 kJ/mol; k = 10^0.60 = 3.98 M⁻¹ s⁻¹ →
# ΔG‡ = RT ln(k_B T / h k) = 69.60 kJ/mol.
experimental = """Experiment (water, 25 °C): cyanide addition to acetone, alkoxide formation. Equilibrium K = [R₂C(O⁻)CN]/([R₂C=O][CN⁻]), log K = −1.84, K = 0.0145 M⁻¹, ΔG° = +10.5 kJ/mol (+2.5 kcal/mol); rate = k[CN⁻][R₂C=O], log k = 0.60, k = 4.0 M⁻¹ s⁻¹, ΔG‡ = 69.6 kJ/mol (16.6 kcal/mol) (Eyring, 298.15 K, 1 M standard state, no transmission correction). All three measured values are in the tables above, next to the computed ones. Source: Schlesinger and Miller 1973 (G. Schlesinger and S. L. Miller, J. Am. Chem. Soc. 1973, 95, 3729–3735, doi:10.1021/ja00792a043), Table IV, acetone row: k₂ = 3.97 M⁻¹ s⁻¹ (CN⁻ + acetone → alkoxide), K₂ = 68.5 M (alkoxide → acetone + CN⁻; 1/K₂ = 0.0146 M⁻¹), k₋₂ = 272 s⁻¹ (alkoxide → acetone + CN⁻), giving ΔG‡ = 69.6 kJ/mol (16.6 kcal/mol), ΔG° = +10.5 kJ/mol (+2.5 kcal/mol) and ΔG‡(reverse) = 59.1 kJ/mol (14.1 kcal/mol). The same values, as log k = 0.60 and log K = −1.84, are compiled in Guthrie 1998 (J. P. Guthrie, J. Am. Chem. Soc. 1998, 120, 1688–1694, doi:10.1021/ja970506q, Table 1). Values confirmed by J. Picione from Guthrie's Table 1 and from the original paper (2026-11-11)."""

experimental_confirmed = true

limitations = [
  "The path ends at the alkoxide, (CH₃)₂C(CN)O⁻, which lies above separated cyanide + acetone in free energy (ΔG = +34.4 kJ/mol (+8.2 kcal/mol) at the working level and +36.3 kJ/mol (+8.7 kcal/mol) at DLPNO-CCSD(T)/ma-def2-TZVP, 298 K, 1 M; electronically it is 14.5 kJ/mol (3.5 kcal/mol) and 12.5 kJ/mol (3.0 kcal/mol) below): the addition step on its own is uphill. The neutral cyanohydrin forms only after a later proton transfer (from HCN or water) that this path does not model.",
  "Implicit solvent under-stabilizes the alkoxide: SMD has no explicit water molecules, so the hydrogen bonds that water donates to the alkoxide oxygen are missing. Against experiment, DLPNO-CCSD(T)/ma-def2-TZVP puts the barrier 9.9 kJ/mol (2.4 kcal/mol) too high (79.5 against 69.6 kJ/mol) and the reaction free energy 25.8 kJ/mol (6.2 kcal/mol) too high (+36.3 against +10.5 kJ/mol). The barrier error is about 38 % of the product error, and the transition state is about 40 % pyramidalized at the carbonyl carbon (sum of its three bond angles 10.3° below 360°, against 25.3° below in the alkoxide). This is consistent with hydrogen bonds to the developing alkoxide oxygen being missing in proportion to how far the alkoxide has formed, but it is not proven: no explicit water molecules were modelled.",
  "The working-level barrier, ΔG‡ = 71.2 kJ/mol (17.0 kcal/mol), is closer to experiment (69.6 kJ/mol) than coupled cluster only through cancellation of errors: with the same functional, the larger ma-def2-TZVP basis raises it to 77.5 kJ/mol (18.5 kcal/mol).",
  "The measured equilibrium constant rests on an estimated acidity of the cyanohydrin O–H (K₃ = 6.3 × 10⁻¹³, pKa 12.2, from a substituent-constant correlation, Ballinger and Long 1960, not a direct measurement), so ΔG° = +10.5 kJ/mol carries an uncertainty of a few kJ/mol. The forward rate constant does not depend on it. The reverse rate constant does: Schlesinger and Miller derive it rather than measure it, k₋₂ = k₂K₂ = k₂K′K_HCN/K₃ (their equation 24, p. 3734; 3.97 × 68.5 = 272 s⁻¹), so the reverse barrier from it (59.1 kJ/mol) carries the same uncertainty.",
  "Table IV of Schlesinger and Miller does not state where the acetone rate constant comes from. They cite Svirbely and Roth 1953 as the earlier kinetic study of acetone, so that is its probable origin; this is not confirmed.",
  "The measured rate constant refers to free cyanide (rate = k[CN⁻][R₂C=O]); observed rates depend on pH, because only CN⁻, not HCN, adds to the carbonyl.",
  "Reactant end of the path: the stopping rule ended the reactant side 0.94 kJ/mol (0.22 kcal/mol) above the optimized reactant complex, at an RMSD of 0.245 Å, while the energy was still falling slowly in this loosely bound complex. An optimization from that last frame reaches the same complex: −0.07 kJ/mol (−0.02 kcal/mol) from it, no imaginary frequency, all-atom RMSD 0.393 Å (heavy atoms 0.110 Å), the C(N)···C distance within 0.007 Å; it differs only in the rotation of the methyl groups (accepted by J. Picione, 2026-11-14).",
