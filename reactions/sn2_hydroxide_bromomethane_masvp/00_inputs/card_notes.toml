experimental = """Experiment: k₂(HO⁻ + CH₃Br, water) measured at six temperatures, 292.69–322.91 K (E. A. Moelwyn-Hughes, Proc. R. Soc. Lond. A 1949, 196, 540–553, doi:10.1098/rspa.1949.0044, Table 5; NaOH in water, rates corrected for the competing reaction with water). An Eyring fit of the six points gives ΔH‡ = 93.7 kJ/mol (22.4 kcal/mol), ΔS‡ = −4.1 J mol⁻¹ K⁻¹ (−1.0 cal mol⁻¹ K⁻¹) and ΔG‡(298.15 K, 1 M) = 94.9 kJ/mol (22.7 kcal/mol). 298 K lies inside the measured range, so no extrapolation is involved. The paper's Table 9 gives k₂(298.1 K) = 1.435 × 10⁻⁴ L mol⁻¹ s⁻¹, A = 1.04 × 10¹³ L mol⁻¹ s⁻¹ and Ea = 96.2 ± 0.6 kJ/mol (23.0 ± 0.15 kcal/mol). The same values are summarized in I. Fells and E. A. Moelwyn-Hughes, J. Chem. Soc. 1959, 398, doi:10.1039/JR9590000398 (Table 11, p. 408) and R. H. Bathgate and E. A. Moelwyn-Hughes, J. Chem. Soc. 1959, 2642, doi:10.1039/JR9590002642 (Table 12, p. 2646). Checked against the original measurements by J. Picione, 2026-11-17. The earlier card value came from 1.41 × 10⁻⁴ L mol⁻¹ s⁻¹ (Mabey and Mill 1978, Table 5.1), calculated from the 1959 Arrhenius parameters at 298.0 K; our earlier records treated it as a 298.15 K value, giving 95.0 kJ/mol. Review: W. Mabey and T. Mill, J. Phys. Chem. Ref. Data 1978, 7, 383–415, doi:10.1063/1.555572."""

# Checked against the original measurements (Moelwyn-Hughes 1949) by J. Picione, 2026-11-17.
experimental_confirmed = true

