experimental = """Experiment: k₂(HO⁻ + CH₃Br, water) measured at six temperatures, 292.69–322.91 K (E. A. Moelwyn-Hughes, Proc. R. Soc. Lond. A 1949, 196, 540–553, doi:10.1098/rspa.1949.0044, Table 5; NaOH in water, rates corrected for the competing reaction with water). An Eyring fit of the six points gives ΔH‡ = 93.7 kJ/mol (22.4 kcal/mol), ΔS‡ = −4.1 J mol⁻¹ K⁻¹ (−1.0 cal mol⁻¹ K⁻¹) and ΔG‡(298.15 K, 1 M) = 94.9 kJ/mol (22.7 kcal/mol). 298 K lies inside the measured range, so no extrapolation is involved. The paper's Table 9 gives k₂(298.1 K) = 1.435 × 10⁻⁴ L mol⁻¹ s⁻¹, A = 1.04 × 10¹³ L mol⁻¹ s⁻¹ and Ea = 96.2 ± 0.6 kJ/mol (23.0 ± 0.15 kcal/mol). The same values are summarized in I. Fells and E. A. Moelwyn-Hughes, J. Chem. Soc. 1959, 398, doi:10.1039/JR9590000398 (Table 11, p. 408) and R. H. Bathgate and E. A. Moelwyn-Hughes, J. Chem. Soc. 1959, 2642, doi:10.1039/JR9590002642 (Table 12, p. 2646). Checked against the original measurements by J. Picione, 2026-11-17. The earlier card value, 95.0 kJ/mol, came from the rounded 298 K rate constant (1.41 × 10⁻⁴ M⁻¹ s⁻¹) in the critical review of W. Mabey and T. Mill, J. Phys. Chem. Ref. Data 1978, 7, 383–415, doi:10.1063/1.555572 (Table 5.1), which cites the 1959 summary. Reaction free energy in water (298.15 K; tables use 1 mol/kg, the calculation 1 mol/L; the 2 → 2 reaction makes the difference vanish): ΔrG° = −100.8 ± 0.4 kJ/mol (−24.1 kcal/mol), from standard formation free energies in the NBS tables (D. D. Wagman et al., J. Phys. Chem. Ref. Data 1982, 11, Suppl. 2): OH⁻(ao) −157.244 kJ/mol (p. 2-38), Br⁻(ao) −103.96 kJ/mol (p. 2-50), CH₃OH(ao) −175.31 kJ/mol (p. 2-84), CH₃Br(g) −25.9 kJ/mol (p. 2-88). CH₃Br(aq) is not tabulated: the gas value plus its hydration, +4.70 kJ/mol from the Henry constant 1.5 × 10⁻³ mol m⁻³ Pa⁻¹ (J. B. Burkholder et al., JPL Publication 19-5, 2019, as compiled by R. Sander, Atmos. Chem. Phys. 2023, 23, 10901–12440, doi:10.5194/acp-23-10901-2023); the measured Henry constants (1.3–1.8 × 10⁻³) give the ± 0.4 kJ/mol, and FreeSolv (D. L. Mobley and J. P. Guthrie, J. Comput.-Aided Mol. Des. 2014, 28, 711–720, doi:10.1007/s10822-014-9747-x) gives +4.53 kJ/mol for the same step. Derivation: docs/experimental_reaction_free_energies.md."""

