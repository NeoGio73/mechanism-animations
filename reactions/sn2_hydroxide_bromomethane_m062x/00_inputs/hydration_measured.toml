# Measured hydration free energies for the SN2 solvation check (J. Picione, 2026-11-19), read from the sources on
# 2026-11-19. Standard state for every value: ideal gas at 1 mol/L -> ideal solution at 1 mol/L, 298 K (Ben-Naim).
# kcal/mol as printed; kJ/mol = kcal/mol x 4.184.

[reaction]
# Measured reaction free energy in water, 298.15 K (results summary, section 7; NBS tables + Henry constant of CH3Br;
# docs/experimental_reaction_free_energies.md). The 2 -> 2 reaction makes it independent of the standard state.
dG_solution_kJ = -100.8
dG_solution_err_kJ = 0.4

[species.methanol]
dG_solv_kcal = -5.10
dG_solv_kJ = -21.338
err_kcal = 0.60   # FreeSolv default: "Experimental uncertainty not presently available, so assigned a default value"
source = "FreeSolv v0.52 (D. L. Mobley and J. P. Guthrie, J. Comput.-Aided Mol. Des. 2014, 28, 711), database.txt entry mobley_1636752 (SMILES CO), field 'experimental value'; experimental reference given there: Rizzo et al., J. Chem. Theory Comput. 2006, 2, 128 (doi:10.1021/ct050097l)"
standard_state_note = "FreeSolv does not state its standard state; its methanol value equals the 1 M -> 1 M value of Kelly, Cramer and Truhlar 2006, Table 3 (-5.1 kcal/mol)"

[species.bromomethane]
dG_solv_kcal = -0.82
dG_solv_kJ = -3.431
err_kcal = 0.60   # FreeSolv default, as for methanol
source = "FreeSolv v0.52, database.txt entry mobley_8983100 (SMILES CBr), field 'experimental value'; experimental reference: Rizzo et al. 2006 (doi:10.1021/ct050097l)"

[species.hydroxide]
dG_solv_kcal = -104.7
dG_solv_kJ = -438.065
source = "C. P. Kelly, C. J. Cramer and D. G. Truhlar, J. Phys. Chem. B 2006, 110, 16066 (doi:10.1021/jp063552y), Table 8 ('this work' column), p. 58 of the authors' final manuscript (comp.chem.umn.edu/Truhlar/docs/final744.pdf); standard state: Section 2, manuscript pp. 5-6, and Table 8 footnote"
proton_reference = "absolute; dG*solv(H+) = -265.9 kcal/mol (Table 8)"

[species.bromide]
dG_solv_kcal = -68.3
dG_solv_kJ = -285.767
source = "Kelly, Cramer and Truhlar 2006, Table 8 ('this work' column), manuscript p. 58"
proton_reference = "absolute; dG*solv(H+) = -265.9 kcal/mol (Table 8); the uncertainty of the proton value (no less than 2 kcal/mol, abstract) cancels in the bromide - hydroxide difference"

[cross_check]
# Same table, column 'ref 23' (Pliego and Riveros, Phys. Chem. Chem. Phys. 2002, 4, 1622, as quoted by Kelly et al.):
hydroxide_kcal = -105.0
bromide_kcal = -68.6
