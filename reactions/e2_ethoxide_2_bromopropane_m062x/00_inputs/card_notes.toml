# card says nothing about the orbitals; docs/results/e2_orbital_measures.md)
mechanism_note = """In this calculation (implicit ethanol) the reaction is one step with no intermediate: ethoxide takes the proton first, the C=C double bond forms as the C–H bond breaks, and bromide leaves last. The C–Br bond is already stretched at the transition state (2.26 Å, from 2.00 Å), but bromide moves away only after the proton has moved: just after the transition state (0.5 bohr·amu½ further along the path), O–H is 1.06 Å while C–Br is 2.28 Å. The energy falls at every frame from the transition state to the product end."""

course_mapping = "McMurry chapter __ (to be filled in)"

experimental = """Experiment: 2-bromopropane + 1 N NaOEt in dry ethanol, 25.0 °C (M. L. Dhar, E. D. Hughes and C. K. Ingold, J. Chem. Soc. 1948, 2058–2065, doi:10.1039/JR9480002058; Mechanism of elimination reactions, Part X). Table I: overall second-order 10⁵k₂ = 0.295 L mol⁻¹ s⁻¹ (k₂ = 2.95 × 10⁻⁶), corrected for solvent expansion, with 80.3 % olefin (two determinations, 82.7 and 78.0 %), the rest SN2 ether. Table VII's 10⁶k₂ = 2.88 is the uncorrected mean of a single run and is not used. Table II: 10⁵k(E2) = 0.237 L mol⁻¹ s⁻¹, i.e. k(E2) = 2.37 × 10⁻⁶ L mol⁻¹ s⁻¹. Caveats stated in the paper: the first-order (solvolysis) processes contribute up to 2–3 % of the rate, and the olefin proportions are good to within 3 %, with a correction for loss of the volatile propene. Values checked against the original paper by J. Picione (2026-11-13; again 2026-11-20, with the table details above). See also E. D. Hughes, C. K. Ingold, S. Masterman and B. J. McNulty, J. Chem. Soc. 1940, 899–912, doi:10.1039/JR9400000899 (Part V), and M. L. Dhar, E. D. Hughes, C. K. Ingold, A. M. M. Mandour, G. A. Maw and L. I. Woolf, J. Chem. Soc. 1948, 2093, doi:10.1039/JR9480002093 (Part XVI). Eyring at 298.15 K (1 M standard state): k(E2) = 2.37 × 10⁻⁶ L mol⁻¹ s⁻¹ gives ΔG‡(E2) = 105.1 kJ/mol (25.1 kcal/mol); the SN2 share (0.58 × 10⁻⁶ L mol⁻¹ s⁻¹) gives ΔG‡(SN2) = 108.6 kJ/mol (26.0 kcal/mol). The two pathways differ by only about 3.5 kJ/mol (0.8 kcal/mol), which is why a secondary bromide with ethoxide gives mostly, not only, alkene."""

