orbital_note = """In this pericyclic reaction the clockwise and counter-clockwise arrow drawings are mirror images of the same mechanism, and the mirror-symmetric transition state favours neither. The direction shown is the one the orbital localization settled on, not a physical preference (the viewer's "mirror direction" switch shows the other one)."""

