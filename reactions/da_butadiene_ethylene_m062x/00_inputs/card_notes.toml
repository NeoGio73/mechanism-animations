experimental = """Experiment (gas phase): C₂H₄ + 1,3-butadiene → cyclohexene, second order, 760–921 K: k = 3.0 × 10¹⁰ exp(−27,500 cal mol⁻¹/RT) cm³ mol⁻¹ s⁻¹ (eq. 5), i.e. A = 3.0 × 10⁷ L mol⁻¹ s⁻¹ (4.98 × 10⁻¹⁴ cm³ molecule⁻¹ s⁻¹); a refit of the 13 runs in Table VI gives Ea = 115.1 ± 3.4 kJ/mol (27.5 ± 0.8 kcal/mol). Source: D. Rowley and H. Steiner, Discuss. Faraday Soc. 1951, 10, 198–213, doi:10.1039/DF9511000198; confirmed from the original paper by J. Picione (2026-11-13). Cross-check: NIST Chemical Kinetics Database, squib 1951ROW/STE198-213 (same A and Ea). The measured activation energy refers to equilibrium butadiene in the gas phase at 760–921 K. That is almost all s-trans at room temperature (about 2 % gauche s-cis) but not at the temperatures of the measurement: about 27 % gauche at 760 K and 34 % at 921 K (DLPNO-CCSD(T)/ma-def2-TZVP, gas phase; corrected 2026-11-21, J. Picione). This calculation is in SMD toluene and starts from s-cis butadiene, so the s-trans → s-cis energy is reported separately; the comparison with this measurement uses separate gas-phase calculations, from s-trans butadiene alone and from the equilibrium conformer mixture, each with ethylene. Concerted, synchronous transition state: K. N. Houk, Y.-T. Lin and F. K. Brown, J. Am. Chem. Soc. 1986, 108, 554–556, doi:10.1021/ja00263a059; E. Goldstein, B. Beno and K. N. Houk, J. Am. Chem. Soc. 1996, 118, 6036–6043, doi:10.1021/ja9601494."""

