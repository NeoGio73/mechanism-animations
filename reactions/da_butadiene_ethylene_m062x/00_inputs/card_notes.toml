orbital_details = "In this pericyclic reaction the clockwise and counter-clockwise arrow drawings are mirror images of the same mechanism, and the mirror-symmetric transition state favours neither. The orbitals shown are the computed set, which localized clockwise on this path. The two are equally valid: the direction is the localization's choice, not a physical preference. At 6 frames between the transition state and s = +1.0 bohr·amu½ (frames 181, 182, 185, 187, 188, 198) the localization landed on the counter-clockwise set; there the mirror image of the computed orbitals is shown, which continues the clockwise set. This is valid because the geometry at those frames is mirror-symmetric within 0.001 Å. The viewer's \"mirror direction\" switch shows the mirror image of the displayed set at every frame (the counter-clockwise drawing). The path is mirror-symmetric within 0.0008 Å except at frames 0–2, 4, 6 and 299 (up to 0.0040 Å), and from the transition state to s = +1.0 bohr·amu½ (frames 179–199) the reflected orbitals lie in the computed occupied space (smallest singular value of the 3×17 overlap matrix 0.99982 or higher)."
