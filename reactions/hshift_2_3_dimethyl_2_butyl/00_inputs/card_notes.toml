# Measured value supplied by J. Picione from the paper itself, read 2026-11-11.
experimental = """Experiment: Saunders and Kates 1978 (M. Saunders and M. R. Kates, J. Am. Chem. Soc. 1978, 100, 7082–7083, doi:10.1021/ja00490a060), compound I, the degenerate 1,2-hydride shift in the 2,3-dimethyl-2-butyl cation: ΔG‡ = 13.0 ± 0.4 kJ/mol (3.1 ± 0.1 kcal/mol) at −138 °C (135 K); k = 3.1 × 10⁷ s⁻¹ at 135 K, 4.6 × 10⁷ s⁻¹ at −128 °C (145 K) and 1.4 × 10⁸ s⁻¹ at −119 °C (154 K). Solvent 50:50 SO₂ClF/SO₂F₂ (superacid medium); ¹³C NMR line broadening at 67.9 MHz in the fast-exchange limit; temperatures ±2 °C. The authors did not fit an Arrhenius equation, so there is no measured activation energy. Checked by J. Picione against the original paper (2026-11-11).

The comparison is made at 135 K, not 298 K, and in a different medium: the experiment is in a superacid medium, the calculation in SMD dichloromethane (and in the gas phase). Computed ΔG‡ is measured from the lowest cation conformer. At 135 K, RT is only 1.12 kJ/mol, so a small error in the barrier is a large error in rate: the 5.4 kJ/mol (1.3 kcal/mol) gap between the working-level ΔG‡ in dichloromethane (18.4 kJ/mol) and the reported 13.0 kJ/mol corresponds to a factor of about 120 in rate. The rate ratio therefore looks much worse than the agreement in energy.

The authors infer from their data that hyperconjugation is weaker at the transition state than in the cation."""
experimental_confirmed = true

