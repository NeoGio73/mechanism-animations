# The 135 K comparison sentence above was updated 2026-11-22 from the finished path folder (was 5.4 kJ/mol, 18.4 kJ/mol, factor 120).
# J. Picione, 2026-11-12: when the card is built, the tunnelling note below uses the M06-2X imaginary
# frequency, not the B3LYP 563i cm⁻¹; done 2026-11-22 with the production TS (115.2i cm⁻¹; the 108.9i was the level-test TS).
